<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>相識影片 · 地圖時間軸</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/MarkerCluster.css">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root{
    --maroon:#7d1f2e; --maroon-2:#a3313f; --rose:#d0546e; --gold:#c9a24a; --ink:#1f1a1c;
    --pin-w:170px; --card-scale:1;
    --font:"Helvetica Neue","TeX Gyre Heros","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;   /* iMovie 預設的樣子：英數 Helvetica Neue、中文蘋方；錄影機器上用對應的替代字型 */
  }
  html,body{height:100%;margin:0;background:#dfe9ef;font-family:var(--font);color:var(--ink);overflow:hidden}
  #map{position:absolute;inset:0;cursor:none}
  #map.show-cursor{cursor:default}
  .leaflet-container{font-family:var(--font)}

  /* ---- 照片縮圖標記（照片 App 風格） ---- */
  .pm{position:relative;width:64px;height:64px;border-radius:14px;background:#fff;
      box-shadow:0 0 0 3px #fff,0 4px 12px rgba(0,0,0,.35);transition:transform .18s ease,opacity .3s ease;will-change:transform}
  .pm img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
  .pm::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;
      transform:translateX(-50%) rotate(45deg);border-radius:2px;box-shadow:3px 3px 5px rgba(0,0,0,.15)}
  .pm .cnt{position:absolute;left:4px;bottom:4px;padding:1px 7px;border-radius:9px;background:rgba(20,16,18,.72);
      color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(3px)}
  .leaflet-marker-icon:hover .pm,.pm.hot{transform:scale(1.12)}
  .leaflet-marker-icon{background:transparent;border:0}

  /* ---- 軌跡：照片彈出時淡出，結尾一起浮現 ---- */

  /* ---- 圖釘 ---- */
  .pin{position:absolute;left:0;top:0;pointer-events:none;z-index:840;transform:translate(-50%,-100%);
       filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transition:opacity .35s ease;opacity:0}
  .pin.on{opacity:1}
  #pin{width:var(--pin-w)}
  #pin img{width:100%;display:block}
  .pin.walk .fig{animation:bob .55s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
  /* 單人：預設從雙人圖釘左右各切一半（會合時完全無縫） */
  .half{width:calc(var(--pin-w)/2);aspect-ratio:430/524;background:url(pin.png) no-repeat;background-size:200% 100%}
  #pinJ .half{background-position:left center}
  #pinP .half{background-position:right center}
  .pin img.single{height:calc(var(--pin-w)*524/860*1.04);width:auto;display:block}

  /* ---- 照片卡（四個角落彈出） ---- */
  .card{position:absolute;z-index:850;pointer-events:none;left:0;top:0;opacity:0;
        transform:translate(-50%,-50%) scale(.06) rotate(0deg);
        transition:transform .75s cubic-bezier(.2,.85,.25,1.08),left .75s cubic-bezier(.2,.85,.25,1),top .75s cubic-bezier(.2,.85,.25,1),opacity .35s ease}
  .card.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--rot,0deg))}
  .card.out{opacity:0;transform:translate(-50%,-50%) scale(.92) rotate(var(--rot,0deg));transition:opacity .4s ease,transform .4s ease}
  .card.ghost{opacity:.18;transition:opacity 1.6s ease}
  .card.ghost.out{opacity:0;transition:opacity .4s ease,transform .4s ease}
  .polaroid{background:#fff;padding:10px 10px 12px;border-radius:6px;box-shadow:0 12px 34px rgba(0,0,0,.32)}
  .polaroid img{display:block;max-width:var(--cw);max-height:var(--ch);border-radius:3px;background:#eee}
  .polaroid .cap{margin-top:8px;font-size:14px;color:#4a3f42;display:flex;justify-content:space-between;gap:12px}
  .polaroid .cap b{color:var(--maroon);font-weight:700}
  /* 手動模式滑到縮圖的小卡 */
  #hover{position:absolute;z-index:860;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .25s,transform .3s}
  #hover.on{opacity:1;transform:scale(1)}
  #hover .fan{display:flex;align-items:flex-end;gap:12px}
  #hover .polaroid img{max-width:260px;max-height:260px}
  #hover .grid{background:rgba(255,255,255,.96);padding:10px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);display:grid;grid-template-columns:repeat(4,72px);gap:6px}
  #hover .grid img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
  #hover .grid .more{width:72px;height:72px;border-radius:8px;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  #hover .grid .gcap{grid-column:1/-1;font-size:13px;color:#4a3f42;padding:2px 2px 0}

  /* ---- 字卡：上方日期／地點，下方字幕 ---- */
  #hud{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:950;pointer-events:none;text-align:center;
       background:rgba(255,255,255,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
       border-radius:22px;padding:16px 36px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:320px;transition:opacity .4s}
  #hud .d{font-size:56px;font-weight:800;letter-spacing:.5px;color:var(--maroon);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
  #hud .p{font-size:34px;font-weight:600;margin-top:6px}
  #sub{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);z-index:950;pointer-events:none;
       background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
       border-radius:22px;padding:16px 40px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:48px;font-weight:700;line-height:1.25;
       color:var(--ink);text-align:center;max-width:88vw;transition:opacity .4s,bottom .3s}
  body:not(.hide-ui) #sub{bottom:150px}
  body.hud-hidden #hud,body.hud-hidden #sub{opacity:0}

  /* ---- 控制列 ---- */
  #bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:800;width:min(1120px,calc(100% - 48px));
       background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
       border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 18px 10px;cursor:default;transition:opacity .3s,transform .3s}
  body.hide-ui #bar{opacity:0;transform:translate(-50%,40px);pointer-events:none}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  button,select{font-family:inherit;font-size:14px;border:0;border-radius:10px;padding:7px 12px;background:#efe6e7;color:var(--ink);cursor:pointer}
  button:hover{background:#e6d6d8}
  button.primary{background:var(--maroon);color:#fff;font-weight:700;min-width:84px}
  button.primary:hover{background:var(--maroon-2)}
  .sp{flex:1}
  .hint{font-size:12px;color:#7a6d70}
  #clock{font-variant-numeric:tabular-nums;color:var(--maroon);font-weight:600;min-width:150px}
  body.planned .manual-only{display:none}
  #tl{position:relative;height:46px;margin-top:8px}
  #tl .track{position:absolute;left:0;right:0;top:14px;height:4px;background:#e2d8da;border-radius:2px}
  #tl .done{position:absolute;left:0;top:14px;height:4px;background:var(--maroon);border-radius:2px;width:0}
  #tl .dot{position:absolute;top:10px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--maroon);
           transform:translateX(-50%);cursor:pointer;box-sizing:border-box;transition:transform .15s}
  #tl .dot:hover{transform:translateX(-50%) scale(1.35)}
  #tl .dot.done{background:var(--maroon)}
  #tl .dot.cur{background:var(--gold);transform:translateX(-50%) scale(1.5)}
  #tl .yr{position:absolute;top:26px;font-size:11px;color:#7a6d70;transform:translateX(-50%);white-space:nowrap}
  #tl .yr::before{content:"";position:absolute;left:50%;top:-8px;width:1px;height:6px;background:#b9adaf}
  .leaflet-control-attribution{font-size:10px;opacity:.75}
  .leaflet-top.leaflet-right{top:18px;right:16px}
  #help{position:absolute;right:16px;bottom:22px;z-index:800;font-size:12px;color:#5b4f52;background:rgba(255,255,255,.85);
        padding:8px 12px;border-radius:12px;backdrop-filter:blur(8px);line-height:1.6;display:none;cursor:default}
  #help.on{display:block}
  body.hide-ui #help{display:none}
</style>
</head>
<body>
<div id="map"></div>

<div id="pinJ" class="pin"><div class="fig"><div class="half"></div></div></div>
<div id="pinP" class="pin"><div class="fig"><div class="half"></div></div></div>
<div id="pin" class="pin"><div class="fig"><img src="pin.png" alt=""></div></div>
<div id="cards"></div>
<div id="hover"></div>

<div id="hud">
  <div class="d" id="hudDate">相識影片</div>
</div>
<audio id="bgm" preload="auto"></audio>
<div id="sub" style="opacity:0"></div>

<div id="bar">
  <div class="row">
    <button class="primary" id="btnPlay">▶ 播放</button>
    <button id="btnPrev" title="上一章 (←)">◀︎</button>
    <button id="btnNext" title="下一章 (→)">▶︎</button>
    <button id="btnMode" title="切換自動 / 手動 (M)">模式：自動</button>
    <label class="hint">總長
      <select id="total"><option value="bgm" id="totalBgm">跟配樂一樣長</option><option value="150">2.5 分鐘</option><option value="180" selected>3 分鐘</option><option value="210">3.5 分鐘</option><option value="240">4 分鐘</option><option value="300">5 分鐘</option><option value="0">手動</option></select>
    </label>
    <span class="hint" id="clock">⏱ 0:00 / 3:00</span>
    <label class="hint manual-only">速度
      <select id="speed"><option value="0.6">慢</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2.2">快</option></select>
    </label>
    <label class="hint manual-only">停留
      <select id="dwell"><option value="2000">短</option><option value="3500" selected>中</option><option value="5000">長</option></select>
    </label>
    <label class="hint"><input type="checkbox" id="bgmOn" checked> 配樂</label>
    <label class="hint">底圖
      <select id="basemap"><option value="liberty">Liberty</option><option value="positron">淺色簡潔</option><option value="bright">明亮彩色</option><option value="osm">OSM 標準</option><option value="sat">衛星</option></select>
    </label>
    <span class="sp"></span>
    <button id="btnTrail" title="清除軌跡 (C)">清除軌跡</button>
    <button id="btnOverview" title="縮放到全部 (O)">總覽</button>
    <button id="btnHide" title="隱藏介面 (H)">隱藏</button>
    <button id="btnHelp" title="快速鍵">?</button>
  </div>
  <div id="tl"><div class="track"></div><div class="done" id="tlDone"></div></div>
</div>
<div id="help">
  <b>快速鍵</b><br>
  空白鍵 播放/暫停 · ← → 上一章/下一章 · M 自動/手動 · A 配樂開/關<br>
  H 隱藏/顯示控制列 · K 隱藏/顯示字卡與字幕 · C 清除軌跡 · O 總覽 · B 切換底圖<br>
  [ ] 縮小/放大圖釘 · - = 縮小/放大照片卡 · Esc 關閉照片卡<br>
  手動模式：按住左鍵拖曳＝畫軌跡 · 按住 ⌥ Option 拖曳＝移動地圖 · 滾輪＝縮放
</div>

<script src="lib/leaflet.js"></script>
<script src="lib/leaflet.markercluster.js"></script>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/leaflet-maplibre-gl.js"></script>
<script src="photos.js"></script>
<script src="chapters.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const easeInOut = t => t<.5 ? 2*t*t : -1+(4-2*t)*t;
const fmtDate = d => d.replace(/-/g,'.');
const raf = () => new Promise(r => requestAnimationFrame(r));
function newToken(){ const cbs=[]; return { cancelled:false, onCancel(cb){cbs.push(cb)}, cancel(){ this.cancelled=true; cbs.forEach(f=>f()); } }; }
const sleep = (ms, tok) => new Promise((res, rej) => {
  const t = setTimeout(res, Math.max(0, ms));
  if (tok) tok.onCancel(() => { clearTimeout(t); rej(new Error('cancel')); });
});
// 單人圖釘來源：'split' = 從 pin.png 左右各切一半（會合無縫）；'files' = 用 pin_jenny.png / pin_poy.png
const SINGLE_PIN_MODE = 'split';

/* ---------------- 資料 ---------------- */
// 展示用經度：美國那段搬到 +360，讓航線越過太平洋、軌跡不繞地球另一邊
const photos = (window.PHOTOS||[]).map(p => Object.assign({}, p, { plon: p.lon < -30 ? p.lon + 360 : p.lon })).sort((a,b)=>a.id.localeCompare(b.id));
const byId = Object.fromEntries(photos.map(p=>[p.id,p]));
function distKm(a,b){
  const R=6371, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function dateRange(list){
  const ds=[...new Set(list.map(p=>p.date))].sort(); if (!ds.length) return '';
  const a=ds[0], b=ds[ds.length-1];
  if (a===b) return fmtDate(a);
  return a.slice(0,4)===b.slice(0,4) ? `${fmtDate(a)} – ${fmtDate(b).slice(5)}` : `${fmtDate(a)} – ${fmtDate(b)}`;
}
const chapters = (window.CHAPTERS||[]).map((c,i)=>{
  const ps = c.photos.map(id=>byId[id]).filter(Boolean);
  const missing = c.photos.filter(id=>!byId[id]); if (missing.length) console.warn('章節缺照片', c.title, missing);
  const pages=[]; for (let k=0;k<ps.length;k+=4) pages.push(ps.slice(k,k+4));
  const lls = ps.map(p=>L.latLng(p.lat,p.plon));
  if (!lls.length && c.at) lls.push(L.latLng(c.at[0], c.at[1] < -30 ? c.at[1]+360 : c.at[1]));
  const bounds = L.latLngBounds(lls);
  // 上方顯示的日期：chapters.js 的 date 直接當文字用；時間軸位置抓文字裡第一個 YYYY.MM.DD，抓不到就用第一張照片的日期
  const dateText = (c.date || c.dateLabel || dateRange(ps)).trim();
  const m = dateText.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  const tlDate = m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : (ps.length ? ps.map(p=>p.date).sort()[0] : null);
  return Object.assign({}, c, { idx:i, ps, pages: pages.length?pages:[[]], lls, bounds, center: bounds.getCenter(),
    first: lls[0], last: lls[lls.length-1], date: tlDate, dateText, hold: c.hold || 1, minSec: +c.minSec || 0 });
}).filter(c=>c.lls.length);
const INTRO = window.INTRO || null, ENDING = window.ENDING || {title:'我們的足跡', caption:''};
// 結尾收束：ENDING.finale = { photo, date, caption, zoom }，從世界慢慢拉回這張照片的地點（婚禮場地）
const FINALE = (ENDING.finale && byId[ENDING.finale.photo]) ? Object.assign({ zoom:15.5 }, ENDING.finale, { p: byId[ENDING.finale.photo] }) : null;
if (ENDING.finale && !FINALE) console.warn('ENDING.finale 指到不存在的照片', ENDING.finale.photo);

/* ---------------- 地圖 ---------------- */
const map = L.map('map', { zoomControl:false, zoomSnap:0, zoomDelta:.5, wheelPxPerZoomLevel:90, minZoom:2, maxZoom:19, worldCopyJump:false, inertia:true });
L.control.zoom({ position:'topright' }).addTo(map);
const OFM_ATTR = '<a href="https://openfreemap.org">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const BASEMAPS = {
  liberty: { type:'gl', style:'https://tiles.openfreemap.org/styles/liberty' },
  positron:{ type:'gl', style:'https://tiles.openfreemap.org/styles/positron' },
  bright:  { type:'gl', style:'https://tiles.openfreemap.org/styles/bright' },
  osm:     { type:'raster', url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', maxZoom:19, attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' },
  sat:     { type:'raster', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maxZoom:18, attr:'Tiles &copy; Esri' },
};
const POSITRON_TINT = { 'background':'#f6f3ee','water':'#b9d7ec','waterway':'#a9cbe3','park':'#cfe6c6','landcover_wood':'#d5e6cc','landuse_residential':'#efebe4','building':'#e6e1d9','landcover_ice_shelf':'#f4f6f7','landcover_glacier':'#f4f6f7','road_area_pier':'#f6f3ee','road_pier':'#f6f3ee' };
let baseLayer=null, baseKey=null;
function patchStyle(gl){
  try {
    const st = gl.getStyle(); if (!st || !st.layers) return;
    for (const ly of st.layers){
      if (ly.type==='symbol' && ly.layout && ly.layout['text-field']){
        const tf = JSON.stringify(ly.layout['text-field']);
        if (tf.includes('name')) gl.setLayoutProperty(ly.id, 'text-field', ['coalesce', ['get','name:zh-Hant'], ['get','name']]);
      }
      if (baseKey==='positron' && POSITRON_TINT[ly.id]){
        const prop = ly.type==='background' ? 'background-color' : ly.type==='line' ? 'line-color' : 'fill-color';
        gl.setPaintProperty(ly.id, prop, POSITRON_TINT[ly.id]);
      }
    }
  } catch(e){ console.warn('patchStyle', e); }
}
function setBasemap(key){
  const def = BASEMAPS[key]; if (!def || key===baseKey) return;
  if (baseLayer){ map.removeLayer(baseLayer); baseLayer=null; }
  baseKey = key;
  if (def.type==='gl'){
    baseLayer = L.maplibreGL({ style:def.style, interactive:false, attribution:OFM_ATTR, updateInterval:16 }).addTo(map);
    const gl = baseLayer.getMaplibreMap(); gl.on('style.load', ()=>patchStyle(gl)); gl.on('error', ev=>console.warn('basemap', ev && ev.error && ev.error.message));
  } else baseLayer = L.tileLayer(def.url, { maxZoom:def.maxZoom, attribution:def.attr }).addTo(map);
  const sel=$('#basemap'); if (sel && sel.value!==key) sel.value=key;
}
const allLatLngs = photos.map(p=>L.latLng(p.lat,p.plon));
const twBounds = L.latLngBounds(photos.filter(p=>p.lat>21&&p.lat<26&&p.lon>119&&p.lon<123).map(p=>[p.lat,p.plon]));
if (INTRO){ twBounds.extend(INTRO.jenny.from); twBounds.extend(INTRO.poy.from); }
const homeView = () => map.fitBounds(twBounds.pad(.18), { animate:false });
homeView();

/* ---------------- 標記 ---------------- */
function iconHtml(rep,count){ return `<div class="pm"><img src="thumbs/${rep.id}.jpg" alt="">${count>1?`<span class="cnt">${count}</span>`:''}</div>`; }
const mcg = L.markerClusterGroup({ maxClusterRadius:74, showCoverageOnHover:false, spiderfyOnMaxZoom:false, zoomToBoundsOnClick:true,
  removeOutsideVisibleBounds:false, animate:true, animateAddingMarkers:false,
  iconCreateFunction(cluster){ const kids=cluster.getAllChildMarkers(); const rep=kids.reduce((a,m)=>(!a||m.photo.id>a.id)?m.photo:a,null);
    return L.divIcon({ html:iconHtml(rep,kids.length), className:'', iconSize:[64,64], iconAnchor:[32,73] }); } });
const markers = photos.map(p=>{ const m=L.marker([p.lat,p.plon],{ icon:L.divIcon({ html:iconHtml(p,1), className:'', iconSize:[64,64], iconAnchor:[32,73] }), riseOnHover:true }); m.photo=p; return m; });
mcg.addLayers(markers); map.addLayer(mcg);
function markerEl(p){ const m=markers[photos.indexOf(p)]; const v=mcg.getVisibleParent(m)||m; return v.getElement && v.getElement(); }
function hotPhotos(list,on){ list.forEach(p=>{ const el=markerEl(p); const pm=el&&el.querySelector('.pm'); if (pm) pm.classList.toggle('hot',on); }); }

/* ---------------- 軌跡 ---------------- */
// 用 Canvas 畫（每格整張重畫，不會像 SVG 圖層在縮放時殘留上一格的線）；淡出／浮現用 JS 補間，不靠 CSS transition
const trails = [];   // 所有軌跡（每章／每頁一條，開場兩條）
const trailCanvas = L.canvas({ padding: .15 });
function mkTrail(color){
  const opts={lineCap:'round',lineJoin:'round',renderer:trailCanvas,interactive:false};
  const halo=L.polyline([[]],Object.assign({color:'#fff',weight:9,opacity:.85},opts)).addTo(map);
  const line=L.polyline([[]],Object.assign({color,weight:4.5,opacity:.95},opts)).addTo(map); let segs=[[]];
  let alpha=1, anim=null;
  const apply=()=>{ halo.setStyle({opacity:.85*alpha}); line.setStyle({opacity:.95*alpha}); };
  const tween=(to,dur)=>{ if (anim) cancelAnimationFrame(anim); const from=alpha, t0=performance.now();
    const step=now=>{ const k=clamp((now-t0)/dur,0,1); alpha=from+(to-from)*easeInOut(k); apply(); anim = k<1 ? requestAnimationFrame(step) : null; };
    anim=requestAnimationFrame(step); };
  const t={ add(ll){ segs[segs.length-1].push(ll); halo.addLatLng(ll, halo.getLatLngs()[segs.length-1]); line.addLatLng(ll, line.getLatLngs()[segs.length-1]); },
    brk(){ if (!segs[segs.length-1].length) return; segs.push([]); halo.setLatLngs(segs.map(s=>s.slice())); line.setLatLngs(segs.map(s=>s.slice())); },
    fade(){ tween(0, 900); },
    reveal(){ tween(1, 1600); },
    remove(){ if (anim) cancelAnimationFrame(anim); map.removeLayer(halo); map.removeLayer(line); } };
  trails.push(t); return t;
}
let trail = mkTrail('#8b1e2d');                  // 目前正在畫的那條（手動模式也用它）
function newTrail(color='#8b1e2d'){ trail = mkTrail(color); return trail; }

/* ---------------- 圖釘 ---------------- */
const mapEl=$('#map'), pinEl=$('#pin'), pinJ=$('#pinJ'), pinP=$('#pinP');
if (SINGLE_PIN_MODE==='files'){ pinJ.querySelector('.fig').innerHTML='<img class="single" src="pin_jenny.png" alt="">'; pinP.querySelector('.fig').innerHTML='<img class="single" src="pin_poy.png" alt="">'; }
let pinW=170, pinLL=null;   // pinLL：圖釘目前站的地理位置（自動模式）
function setPinW(w){ pinW=clamp(w,40,320); document.documentElement.style.setProperty('--pin-w',pinW+'px'); }
function place(el,x,y,dx=0){ el.style.transform=`translate(${x+dx}px,${y}px) translate(-50%,-100%)`; }
function pinTo(ll){ pinLL=L.latLng(ll); const pt=map.latLngToContainerPoint(pinLL); place(pinEl,pt.x,pt.y); }
function pinShow(on){ pinEl.classList.toggle('on',on); }
function walk(el,on){ el.classList.toggle('walk',on); }
const halfW = () => pinW/4;   // 單人半寬的一半：會合時 Jenny 在左、Poy 在右

/* ---------------- 照片卡 ---------------- */
const cardsEl=$('#cards'); let cards=[]; let cardScale=1;
function setCardScale(s){ cardScale=clamp(s,.5,1.6); document.documentElement.style.setProperty('--card-scale',cardScale); }
function slotsFor(n){ // 卡片中心的畫面比例位置與尺寸
  const W=mapEl.clientWidth, H=mapEl.clientHeight;
  const S=(fx,fy,fw,fh)=>({ x:W*fx, y:H*fy, w:W*fw*cardScale, h:H*fh*cardScale });
  if (n===1) return [S(.5,.48,.80,.76)];
  if (n===2) return [S(.26,.48,.46,.76), S(.74,.48,.46,.76)];
  // 下排稍微往上收（底部留約 6% 給字幕），字幕才不會壓到照片
  if (n===3) return [S(.26,.245,.48,.46), S(.74,.245,.48,.46), S(.5,.705,.48,.46)];
  return [S(.26,.245,.48,.46), S(.74,.245,.48,.46), S(.26,.705,.48,.46), S(.74,.705,.48,.46)];
}
const ROTS=[-3,2.5,-2,3.5];
async function popCard(p, slot, i, tok){
  const from = map.latLngToContainerPoint([p.lat,p.plon]);
  const el=document.createElement('div'); el.className='card'; el.style.setProperty('--rot',ROTS[i%4]+'deg');
  el.style.setProperty('--cw', (slot.w-24)+'px'); el.style.setProperty('--ch', (slot.h-58)+'px');
  el.innerHTML=`<div class="polaroid"><img src="photos/${p.id}.jpg" alt=""><div class="cap"><b>${fmtDate(p.date)}</b><span>${p.place}</span></div></div>`;
  el.style.left=from.x+'px'; el.style.top=from.y+'px';
  cardsEl.appendChild(el); cards.push(el);
  void el.offsetWidth;   // 先讓瀏覽器算出起始樣式，彈出的過渡動畫才一定會跑（錄影的虛擬時間模式也一樣）
  await raf(); await raf();

}
async function clearCards(tok, fade=true){

/* ---------------- 字卡 / 字幕 / 時間軸 ---------------- */
const hudEl=$('#hud'), hud={ d:$('#hudDate') }, subEl=$('#sub');
function hudSet(date){ hud.d.textContent=date||''; hudEl.style.opacity = date ? '' : 0; }
function subSet(text){ subEl.textContent=text||''; subEl.style.opacity = text ? 1 : 0; }
const tl=$('#tl'), tlDone=$('#tlDone');
const dated = chapters.filter(c=>c.date);
const t0=new Date(dated[0].date).getTime(), t1=Math.max(...photos.map(p=>new Date(p.date).getTime()));
const tpos = d => 2 + 96*((new Date(d).getTime()-t0)/(t1-t0));
chapters.forEach((c,i)=>{ const el=document.createElement('div'); el.className='dot'; el.style.left=tpos(c.date||dated[Math.min(i,dated.length-1)].date)+'%';
  el.title=`${c.dateText} ${c.title}`; el.addEventListener('click',()=>goTo(i)); tl.appendChild(el); c.dot=el; });
{ const y0=new Date(dated[0].date).getFullYear(), y1=new Date(t1).getFullYear();
  for (let y=y0;y<=y1;y++){ const d=`${y}-01-01`; if (new Date(d).getTime()<t0) continue; const el=document.createElement('div'); el.className='yr'; el.style.left=tpos(d)+'%'; el.textContent=y; tl.appendChild(el); } }
function tlUpdate(cur){ chapters.forEach((c,i)=>{ c.dot.classList.toggle('done',i<cur); c.dot.classList.toggle('cur',i===cur); }); tlDone.style.width = cur>=0 ? tpos(chapters[cur].date||dated[0].date)+'%' : '0%'; }

/* ---------------- 時間預算 ---------------- */
let plan=null;
const travelWeight = km => km<1?.45:km<8?.7:km<60?1:km<600?1.3:km<3000?1.9:2.6;
const HOP_MS=360, FADE_MS=450, INTRO_MS=2800;   // 開場（出發→會合）固定 2.8 秒
function pageW(pg,c){ return (1 + .3*(pg.length-1)) * c.hold; }
function buildPlan(targetSec){
  if (!targetSec){ plan=null; return; }
  const legsW = chapters.map((c,i)=> i===0 ? 1.0 : travelWeight(distKm({lat:chapters[i-1].last.lat,lon:chapters[i-1].last.lng},{lat:c.first.lat,lon:c.first.lng})));
  const pagesW = chapters.map(c=>c.pages.map(pg=>pageW(pg,c)));
  const pageMin = chapters.map(c=>c.pages.map(pg=>c.minSec ? c.minSec + pg.length*.12 + .35 : 0));   // 每頁至少停留秒數（chapters.js 的 minSec，照片全部彈出後再算）
  const endW = FINALE ? 8.5 : 3.2;   // 有收束段（拉遠→拉回婚禮地點→照片）時結尾要長一點
  const fixed = (INTRO?INTRO_MS/1000:0) + chapters.reduce((a,c)=>a + c.pages.reduce((b,pg)=>b + pg.length*HOP_MS/1000, 0) + (c.pages.length-1)*FADE_MS/1000 + .25, 0);
  const sum=a=>a.reduce((x,y)=>x+y,0), flat=a=>a.flat();
  let unit=(targetSec-fixed)/(sum(legsW)+sum(flat(pagesW))+endW);
  const T=w=>clamp(w*unit,.6,7), D=(w,m=0)=>Math.max(clamp(w*unit,.9,12), m), E=w=>FINALE?clamp(w*unit,9,20):T(w);   // 結尾收束段至少 9 秒
  const pagesD=()=>sum(pagesW.map((ws,i)=>sum(ws.map((w,j)=>D(w,pageMin[i][j])))));
  for (let k=0;k<8;k++){ const total=fixed+sum(legsW.map(T))+pagesD()+E(endW); unit*=targetSec/total; }
  // 時程表：每章到站時刻、每頁停留結束時刻（毫秒，從播放起算）
  let t = (INTRO ? INTRO_MS : 0);
  const arrive=[], pageEnd=[], legs=legsW.map(w=>T(w)*1000);
  chapters.forEach((c,i)=>{ t += legs[i]; arrive.push(t); pageEnd.push([]);
    c.pages.forEach((pg,j)=>{ t += pg.length*HOP_MS + D(pagesW[i][j], pageMin[i][j])*1000; pageEnd[i].push(t); if (j<c.pages.length-1) t += FADE_MS; }); t += 250; });
  plan={ target:targetSec*1000, legs, arrive, pageEnd, end:E(endW)*1000, unit };
}
const speed=()=>parseFloat($('#speed').value), dwellMs=()=>parseInt($('#dwell').value,10);

/* ---------------- 播放引擎 ---------------- */
let mode='auto', playing=false, cur=-1, token=null, runT0=0, fresh=true, ended=false;   // fresh：尚未播過開場；ended：結尾已播
function legDuration(km){ return km<1?1300:km<8?1900:km<60?2600:km<600?3600:km<3000?5000:6500; }
function midZoom(a,b){ const bz=map.getBoundsZoom(L.latLngBounds(a,b).pad(.6),false); return clamp(Math.min(bz,12.5),2.2,15); }
function chapterZoom(c){
  if (c.zoom) return c.zoom;
  const spanKm = distKm({lat:c.bounds.getSouth(),lon:c.bounds.getWest()},{lat:c.bounds.getNorth(),lon:c.bounds.getEast()});
  if (spanKm < .5) return 13.2;   // 單一地點：看得到街區就好，鄰近章節才不用再縮放
  const sz=map.getSize(); return clamp(map.getBoundsZoom(c.bounds,false,L.point(sz.x*.34, sz.y*.34)), 2.5, 13.5);
}
function lerpLL(a,b,e){ const pa=map.project(a,0), pb=map.project(b,0); return map.unproject(L.point(pa.x+(pb.x-pa.x)*e, pa.y+(pb.y-pa.y)*e),0); }

// 飛行：地圖從目前視野移到 (centerTo, zTo)，圖釘同時從目前位置走到 pinDest（畫軌跡）
async function fly(centerTo, zTo, pinDest, dur, tok, drawTrail=true, arc=true){   // arc=false：不做中途縮小，縮放一路平滑（結尾拉回用）
  const c0=map.getCenter(), z0=map.getZoom(), p0=pinLL||c0, p1=L.latLng(pinDest);
  const zM=arc ? Math.min(midZoom(p0,p1), z0, zTo) : null, start=performance.now();
  const moving = p0.distanceTo(p1) > 5;
  if (moving) walk(pinEl,true);
  await new Promise((res,rej)=>{
    let id; tok.onCancel(()=>{ cancelAnimationFrame(id); rej(new Error('cancel')); });
    function frame(now){
      const t=clamp((now-start)/dur,0,1), e=easeInOut(t);
      const zl=z0+(zTo-z0)*e, z = (moving && arc) ? zl+(zM-zl)*Math.sin(Math.PI*t) : zl;
      map.setView(lerpLL(c0,centerTo,e), z, {animate:false});
      const pll=lerpLL(p0,p1,e); pinTo(pll); if (drawTrail && moving) trail.add(pll);
      if (t<1) id=requestAnimationFrame(frame); else res();
    }
    id=requestAnimationFrame(frame);
  });
  walk(pinEl,false);
}
// 結尾拉回：以目的地為錨點放大——目的地在畫面上的位置從目前所在平滑移到 toPt，同時縮放到 zTo（不會像 fly 那樣先掃過一片海），圖釘同時走到目的地
async function dive(dest, zTo, toPt, dur, tok){
  const z0=map.getZoom(), p1=L.latLng(dest), p0=pinLL||p1, size=map.getSize();
  const fromPt=map.latLngToContainerPoint(p1), half=size.divideBy(2);
  const moving = p0.distanceTo(p1) > 5; if (moving) walk(pinEl,true);
  const start=performance.now();
  await new Promise((res,rej)=>{ let id; tok.onCancel(()=>{ cancelAnimationFrame(id); rej(new Error('cancel')); });
    function frame(now){ const t=clamp((now-start)/dur,0,1), e=easeInOut(t);
      const z=z0+(zTo-z0)*e, pt=L.point(fromPt.x+(toPt.x-fromPt.x)*e, fromPt.y+(toPt.y-fromPt.y)*e);
      map.setView(map.unproject(map.project(p1,z).subtract(pt.subtract(half)), z), z, {animate:false});
      const pll=lerpLL(p0,p1,e); pinTo(pll); if (moving) trail.add(pll);
      if (t<1) id=requestAnimationFrame(frame); else res(); }
    id=requestAnimationFrame(frame); });
  walk(pinEl,false);
}
// 章內小跳：地圖不動，圖釘走到下一張照片的位置
async function hop(dest, tok, dur=HOP_MS){
  const p0=pinLL, p1=L.latLng(dest); if (!p0 || p0.distanceTo(p1) < 3){ pinTo(p1); return; }
  walk(pinEl,true); const start=performance.now();
  await new Promise((res,rej)=>{ let id; tok.onCancel(()=>{cancelAnimationFrame(id); rej(new Error('cancel'));});
    function frame(now){ const t=clamp((now-start)/dur,0,1), e=easeInOut(t); const ll=lerpLL(p0,p1,e); pinTo(ll); trail.add(ll); if (t<1) id=requestAnimationFrame(frame); else res(); }
    id=requestAnimationFrame(frame); });
  walk(pinEl,false);
}

// 開場：兩人各自從老家走到第一章第一張照片的位置，會合成雙人圖釘
async function intro(tok){
  const dest = chapters[0].first, dur = 1900;   // 出發 0.3 s → 走 1.9 s → 會合 0.6 s
  homeView(); await sleep(50, tok);
  const jFrom=L.latLng(INTRO.jenny.from), pFrom=L.latLng(INTRO.poy.from);
  hudSet(''); subSet('');
  pinEl.classList.remove('on'); pinLL=null;
  const trailJ=mkTrail('#d0546e'), trailP=mkTrail('#5f1a2a');
  const put=(el,ll,dx)=>{ const pt=map.latLngToContainerPoint(ll); place(el,pt.x,pt.y,dx); };
  put(pinJ,jFrom,0); put(pinP,pFrom,0); pinJ.classList.add('on'); pinP.classList.add('on');
  await sleep(300, tok);
  walk(pinJ,true); walk(pinP,true);
  const start=performance.now();
  await new Promise((res,rej)=>{ let id; tok.onCancel(()=>{cancelAnimationFrame(id); rej(new Error('cancel'));});
    function frame(now){ const t=clamp((now-start)/dur,0,1), e=easeInOut(t);
      const jl=lerpLL(jFrom,dest,e), pl=lerpLL(pFrom,dest,e);
      put(pinJ,jl,-halfW()*e); put(pinP,pl,halfW()*e); trailJ.add(jl); trailP.add(pl);
      if (t<1) id=requestAnimationFrame(frame); else res(); }
    id=requestAnimationFrame(frame); });
  walk(pinJ,false); walk(pinP,false);
  // 會合：切換成雙人圖釘
  pinTo(dest); pinEl.classList.add('on');
  await sleep(300, tok);
  pinJ.classList.remove('on'); pinP.classList.remove('on');
  await sleep(300, tok);
  fresh=false;
}

// 播一章：飛過去 → 每頁：圖釘在照片間走、照片彈到角落 → 停留 → 淡出
async function playChapter(i, tok, fromChapter){
  const c=chapters[i];
  let zTo=chapterZoom(c);
  const legMs = plan ? Math.max(500, runT0+plan.arrive[i]-performance.now()) : legDuration(pinLL?distKm({lat:pinLL.lat,lon:pinLL.lng},{lat:c.first.lat,lon:c.first.lng}):100)/speed();
  c.ps.forEach(p=>{ const im=new Image(); im.src=`photos/${p.id}.jpg`; });   // 飛行途中先把這章的照片載好
  await clearCards(tok, true);
  hudSet(c.dateText); subSet('');   // 走路時不顯示字幕，照片彈出後才出現
  pinShow(true);
  // 同一區不重新縮放：下一章的地點都已在目前畫面內、且縮放差不到 2 級，就不動地圖，圖釘直接走過去
  const inView = map.getBounds().pad(-.12).contains(c.bounds), z0=map.getZoom();
  let keep = c.keepView!==undefined ? !!c.keepView : (fromChapter && inView && (zTo - z0) <= 2);
  if (keep && !inView) zTo = z0;                          // 強制保留縮放但不在畫面內：同縮放平移過去
  newTrail();                                            // 這一章的軌跡（抵達後彈照片時淡出）
  if (keep && inView) await hop(c.first, tok, legMs); else await fly(c.center, zTo, c.first, legMs, tok, fromChapter);
  cur=i; tlUpdate(i);
  for (let j=0;j<c.pages.length;j++){
    const pg=c.pages[j], slots=slotsFor(pg.length);
    if (j>0){ newTrail(); subSet(''); }
    hotPhotos(pg,true);
    for (let k=0;k<pg.length;k++) await hop([pg[k].lat,pg[k].plon], tok);          // 先把這一頁的地點走完
    trailsFadeAll();                                                                   // 軌跡淡出，同時照片從各自地點彈出
    for (let k=0;k<pg.length;k++){ await popCard(pg[k], slots[k], k, tok); await sleep(120, tok); }
    await sleep(350, tok); subSet(c.caption);                                          // 照片到位後再顯示字幕
    const holdMs = plan ? Math.max(c.minSec*1000||1000, runT0+plan.pageEnd[i][j]-performance.now()) : Math.max(c.minSec*1000, dwellMs()*(1+.25*(pg.length-1))/Math.sqrt(speed()));
    await sleep(holdMs, tok);
    hotPhotos(pg,false);
    if (j<c.pages.length-1) await clearCards(tok, true);
  }
}
async function ending(tok){
  // 結尾。沒有 finale：拉遠看全部足跡、停住。有 finale：拉遠看足跡 → 從世界慢慢拉回婚禮地點（圖釘走過去）→ 飯店照片彈出、最後字幕，停到配樂淡出結束
  const endMs = plan ? Math.max(FINALE?9000:5000, runT0+plan.target-performance.now()) : (FINALE?14000:6000)/speed();
  const tEnd = performance.now()+endMs;
  const rest = photos.filter(p=>!FINALE || p!==FINALE.p);
  const yrs=[...new Set(rest.map(p=>p.date.slice(0,4)))].sort();
  hudSet(ENDING.date || (yrs.length>1 ? `${yrs[0]}-${yrs[yrs.length-1]}` : yrs[0]||''));   // 拉遠看足跡時的上方文字：ENDING.date，沒寫就用年份範圍
  subSet(ENDING.caption);
  ghostCards(); trailsRevealAll();
  const b=L.latLngBounds(rest.map(p=>L.latLng(p.lat,p.plon))); if (INTRO){ b.extend(INTRO.jenny.from); b.extend(INTRO.poy.from); }
  const sz=map.getSize(), z=map.getBoundsZoom(b.pad(.08), false, L.point(sz.x*.1, sz.y*.1));
  // 拉遠時以圖釘所在為錨點（圖釘從目前位置平滑移到它在全景裡的位置），臺灣一直在畫面上，世界從旁邊長出來，不會先掃過一片海
  const zoomOut = async (dur) => { const anchor=pinLL||map.getCenter(); const toPt=map.project(anchor,z).subtract(map.project(b.getCenter(),z)).add(sz.divideBy(2)); await dive(anchor, z, toPt, dur, tok); };
  if (!FINALE){ await zoomOut(endMs*.5); await sleep(endMs*.5, tok); return; }
  // 1. 拉遠：所有軌跡浮現，看完整足跡
  await zoomOut(endMs*.18);
  await sleep(endMs*.07, tok);
  // 2. 拉回：上一章的照片淡掉，圖釘從最後一站走向婚禮地點，地圖從世界一路平滑放大到街區；地點落在畫面左側約 3 成處，右邊留給照片
  await clearCards(tok, true);
  const dest=L.latLng(FINALE.p.lat, FINALE.p.plon), zF=FINALE.zoom;
  newTrail();
  const holdMs = Math.max(4000, endMs*.28);   // 最後停在飯店照片上的時間（配樂在這段淡出）
  await dive(dest, zF, L.point(sz.x*.30, sz.y*.5), Math.max(3000, tEnd-performance.now()-holdMs-450), tok);
  // 3. 抵達：婚禮地點的照片從地圖上的位置彈出，換成當天的日期與最後一句字幕
  hudSet(FINALE.date || fmtDate(FINALE.p.date)); subSet('');
  hotPhotos([FINALE.p], true);
  const W=mapEl.clientWidth, H=mapEl.clientHeight;
  await popCard(FINALE.p, { x:W*.72, y:H*.5, w:W*.50*cardScale, h:H*.84*cardScale }, 0, tok);
  await sleep(450, tok); subSet(FINALE.caption || ENDING.caption);
  await sleep(Math.max(1500, tEnd-performance.now()), tok);
}
async function runFrom(i){
  const tok = token = newToken();
  try {
    let fromChapter = cur>=0 && !!pinLL;
    if (i===0 && fresh && INTRO){ await intro(tok); fromChapter=false; }
    while (i<chapters.length && playing && !tok.cancelled){
      await playChapter(i, tok, fromChapter); fromChapter=true; i++;
    }
    if (i>=chapters.length && playing && !tok.cancelled){ await ending(tok); ended=true; setPlaying(false); }
  } catch(e){ if (e.message!=='cancel') console.error(e); }
}

/* 配樂：播放時同步計畫時間軸，結尾淡出 */
const bgm=$('#bgm'); const BGM=window.BGM||null; let bgmReady=false;
if (BGM && BGM.src){ bgm.src = BGM.src.split('/').map(seg => seg==='..'||seg==='.' ? seg : encodeURIComponent(seg)).join('/'); bgm.addEventListener('canplay', ()=>{ bgmReady=true; }); bgm.addEventListener('error', ()=>console.warn('配樂載入失敗', bgm.src)); }
const bgmOn = () => BGM && $('#bgmOn').checked;
function bgmSync(ms){ if (!BGM) return; try { bgm.currentTime = Math.max(0, ms/1000); } catch(e){} }
function bgmPlay(){ if (!bgmOn()) return; bgm.volume = BGM.volume ?? .9; bgm.play().catch(()=>{}); }
function bgmPause(){ if (BGM) bgm.pause(); }
function bgmTick(elapsed){ // 結尾前 fadeOutSec 秒開始淡出
  if (!BGM || bgm.paused || !plan) return;
  const fade=(BGM.fadeOutSec ?? 4)*1000, left=plan.target-elapsed, v=BGM.volume ?? .9;
  bgm.volume = left<=0 ? 0 : left<fade ? v*left/fade : v;
}
$('#bgmOn').addEventListener('change', ()=>{ if (playing){ if (bgmOn()){ bgmSync(clockBase+performance.now()-clockStart); bgmPlay(); } else bgmPause(); } });

/* 時鐘 */
const clockEl=$('#clock'); let clockBase=0, clockStart=0, clockTimer=null;
const mmss=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
function clockRender(){ const el=clockBase+(playing?performance.now()-clockStart:0); bgmTick(el);
  clockEl.textContent=`⏱ ${mmss(el)}${plan?' / '+mmss(plan.target):''}${plan?` · 每頁約 ${plan.unit.toFixed(1)} 秒`:''}`; }
function clockStartFrom(i){ const lastEnd = plan ? plan.pageEnd[plan.pageEnd.length-1].slice(-1)[0]+250 : 0;
  clockBase = plan ? (i<=0 ? 0 : i>=chapters.length ? lastEnd : plan.arrive[i]-plan.legs[i]) : 0; clockStart=performance.now(); runT0=clockStart-clockBase;
  clearInterval(clockTimer); clockTimer=setInterval(clockRender,250); clockRender(); }
function clockStop(){ clockBase+=performance.now()-clockStart; clearInterval(clockTimer); clockRender(); }
function setPlaying(on){ const was=playing; playing=on; $('#btnPlay').textContent=on?'❚❚ 暫停':'▶ 播放'; if (!on&&token) token.cancel(); if (!on&&was) clockStop(); if (!on) bgmPause(); if (!on){ walk(pinEl,false); walk(pinJ,false); walk(pinP,false); } }
function play(){
  if (mode!=='auto') setMode('auto'); if (playing) return;
  let next=cur+1;   // 停在最後一章時按播放 → 播結尾；結尾播完再按 → 從頭重播
  if (ended || next>chapters.length){ next=0; cur=-1; fresh=true; ended=false; trailClearAll(); cards.forEach(el=>el.remove()); cards=[]; }
  setPlaying(true); clockStartFrom(next); bgmSync(clockBase); bgmPlay(); runFrom(next);
}
function pause(){ setPlaying(false); }
async function goTo(i){
  if (i<0||i>=chapters.length) return;
  if (mode!=='auto') setMode('auto');
  const was=playing; if (token) token.cancel();
  playing=true; $('#btnPlay').textContent='❚❚ 暫停';
  const tok=token=newToken();
  try {
    const fromChapter = cur>=0 && !!pinLL;
    if (plan){ clockBase=plan.arrive[i]-plan.legs[i]; clockStart=performance.now(); runT0=clockStart-clockBase; clearInterval(clockTimer); clockTimer=setInterval(clockRender,250); }
    if (was){ bgmSync(clockBase); bgmPlay(); }
    fresh=false; ended=false; pinJ.classList.remove('on'); pinP.classList.remove('on');
    await playChapter(i, tok, fromChapter);
    if (was) runFrom(i+1); else { playing=false; $('#btnPlay').textContent='▶ 播放'; clearInterval(clockTimer); clockRender(); }
  } catch(e){ if (e.message!=='cancel') console.error(e); }
}

/* ---------------- 手動模式 ---------------- */
const hoverEl=$('#hover'); let drawing=false, lastMouse=null, hoverTimer=null, sticky=null, altDown=false;
function setMode(m){
  if (m===mode) return; mode=m; $('#btnMode').textContent='模式：'+(m==='auto'?'自動':'手動');
  trail.brk(); lastMouse=null; drawing=false;
  if (m==='manual'){ pause(); cards.forEach(el=>el.remove()); cards=[]; subSet('手動模式：圖釘跟著滑鼠，按住左鍵留下軌跡'); newTrail(); map.dragging.disable(); }
  else { map.dragging.enable(); hoverHide(); if (pinLL) pinTo(pinLL); }
}
mapEl.addEventListener('mousedown', e=>{ if (mode!=='manual'||e.button!==0||altDown) return; drawing=true; trail.brk(); const r=mapEl.getBoundingClientRect(); const ll=map.containerPointToLatLng([e.clientX-r.left,e.clientY-r.top]); trail.add(ll); lastMouse={x:e.clientX,y:e.clientY}; });
window.addEventListener('mouseup', ()=>{ drawing=false; });
mapEl.addEventListener('mousemove', e=>{
  if (mode!=='manual') return;
  const r=mapEl.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  pinShow(true); place(pinEl,x,y);
  if (drawing && (e.buttons&1) && (!lastMouse || Math.hypot(e.clientX-lastMouse.x,e.clientY-lastMouse.y)>4)){ trail.add(map.containerPointToLatLng([x,y])); lastMouse={x:e.clientX,y:e.clientY}; }
  walk(pinEl,true); clearTimeout(mapEl._walkT); mapEl._walkT=setTimeout(()=>walk(pinEl,false),160);
});
mapEl.addEventListener('mouseleave', ()=>{ if (mode==='manual'){ pinShow(false); drawing=false; } });
document.addEventListener('keydown', e=>{ if (e.key==='Alt' && mode==='manual'){ altDown=true; map.dragging.enable(); } });
document.addEventListener('keyup', e=>{ if (e.key==='Alt'){ altDown=false; if (mode==='manual') map.dragging.disable(); } });
function hoverHtml(list){
  if (list.length<=3) return `<div class="fan">${list.map((p,i)=>`<div class="polaroid" style="transform:rotate(${[-4,3,-2][i]}deg)"><img src="photos/${p.id}.jpg" alt=""><div class="cap"><b>${fmtDate(p.date)}</b><span>${p.place}</span></div></div>`).join('')}</div>`;
  const show=list.slice(0,7), more=list.length-7;
  return `<div class="grid">${show.map(p=>`<img src="thumbs/${p.id}.jpg" alt="">`).join('')}${more>0?`<div class="more">+${more}</div>`:''}<div class="gcap"><b>${list.length} 張</b> · ${dateRange(list)}</div></div>`;
}
function hoverShow(list, pt){
  hoverEl.innerHTML=hoverHtml(list); hoverEl.classList.add('on');
  const W=mapEl.clientWidth, H=mapEl.clientHeight-(document.body.classList.contains('hide-ui')?0:$('#bar').offsetHeight+40);
  hoverEl.style.left='0px'; hoverEl.style.top='0px'; const cw=hoverEl.offsetWidth, ch=hoverEl.offsetHeight;
  let x=pt.x+40, y=pt.y-ch-20; if (x+cw>W-20) x=pt.x-cw-40; if (x<20) x=clamp(pt.x-cw/2,20,W-cw-20); if (y<20) y=pt.y+60; if (y+ch>H-20) y=clamp(H-ch-20,20,H);
  hoverEl.style.left=x+'px'; hoverEl.style.top=y+'px';
}
function hoverHide(){ hoverEl.classList.remove('on'); }
const photosOf = layer => layer.getAllChildMarkers ? layer.getAllChildMarkers().map(m=>m.photo).sort((a,b)=>a.id.localeCompare(b.id)) : [layer.photo];
function onHover(e){ if (mode!=='manual'||sticky) return; clearTimeout(hoverTimer); hoverShow(photosOf(e.layer), map.latLngToContainerPoint(e.layer.getLatLng())); }
function onOut(){ if (mode!=='manual'||sticky) return; hoverTimer=setTimeout(hoverHide,350); }
mcg.on('mouseover',onHover); mcg.on('clustermouseover',onHover); mcg.on('mouseout',onOut); mcg.on('clustermouseout',onOut);
mcg.on('click', e=>{ if (mode!=='manual') return; if (sticky===e.layer){ sticky=null; hoverHide(); } else { sticky=e.layer; hoverShow(photosOf(e.layer), map.latLngToContainerPoint(e.layer.getLatLng())); } });
map.on('click', ()=>{ if (sticky){ sticky=null; hoverHide(); } });
map.on('move zoom', ()=>{ if (mode==='auto' && pinLL && !pinEl.classList.contains('walk')) pinTo(pinLL); if (mode==='manual'&&sticky) hoverShow(photosOf(sticky), map.latLngToContainerPoint(sticky.getLatLng())); });
$('#bar').addEventListener('mouseenter',()=>mapEl.classList.add('show-cursor')); $('#bar').addEventListener('mouseleave',()=>mapEl.classList.remove('show-cursor'));

/* ---------------- 控制 ---------------- */
$('#btnPlay').onclick=()=>playing?pause():play();
$('#btnNext').onclick=()=>goTo(Math.min(cur+1,chapters.length-1));
$('#btnPrev').onclick=()=>goTo(Math.max(cur-1,0));
$('#btnMode').onclick=()=>setMode(mode==='auto'?'manual':'auto');
$('#btnTrail').onclick=()=>trailClearAll();
$('#btnOverview').onclick=()=>{ pause(); const b=L.latLngBounds(allLatLngs); if (INTRO){ b.extend(INTRO.jenny.from); b.extend(INTRO.poy.from);} map.flyToBounds(b.pad(.1),{duration:1.6}); };
$('#btnHide').onclick=()=>document.body.classList.toggle('hide-ui');
$('#btnHelp').onclick=()=>$('#help').classList.toggle('on');
$('#basemap').onchange=e=>setBasemap(e.target.value);
const BASE_KEYS=Object.keys(BASEMAPS);
function totalSec(){ const v=$('#total').value; if (v==='bgm') return (BGM && isFinite(bgm.duration) && bgm.duration>30) ? Math.round(bgm.duration) : 180; return parseInt(v,10); }
function applyTotal(){ buildPlan(totalSec()); document.body.classList.toggle('planned',!!plan); clockRender(); }
$('#total').onchange=applyTotal;
// 有配樂時預設「跟配樂一樣長」：音檔長度讀到後重算時程，結尾淡出剛好落在音樂結束
if (BGM){ $('#total').value='bgm'; bgm.addEventListener('loadedmetadata', ()=>{ $('#totalBgm').textContent=`跟配樂一樣長（${mmss(bgm.duration*1000)}）`; if ($('#total').value==='bgm') applyTotal(); }); }
else $('#totalBgm').remove();
document.querySelectorAll('#bar select').forEach(s=>s.addEventListener('change',e=>e.target.blur()));
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='SELECT' && /^(Arrow|Enter| )/.test(e.key)) return;
  switch(e.key){
    case ' ': e.preventDefault(); playing?pause():play(); break;
    case 'ArrowRight': goTo(Math.min(cur+1,chapters.length-1)); break;
    case 'ArrowLeft': goTo(Math.max(cur-1,0)); break;
    case 'm': case 'M': setMode(mode==='auto'?'manual':'auto'); break;
    case 'h': case 'H': document.body.classList.toggle('hide-ui'); break;
    case 'k': case 'K': document.body.classList.toggle('hud-hidden'); break;
    case 'c': case 'C': trailClearAll(); break;
    case 'a': case 'A': { const cb=$('#bgmOn'); cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); break; }
    case 'o': case 'O': $('#btnOverview').click(); break;
    case 'b': case 'B': setBasemap(BASE_KEYS[(BASE_KEYS.indexOf(baseKey)+1)%BASE_KEYS.length]); break;
    case '[': setPinW(pinW-10); break;
    case ']': setPinW(pinW+10); break;
    case '-': setCardScale(cardScale-.1); break;
    case '=': case '+': setCardScale(cardScale+.1); break;
    case 'Escape': sticky=null; hoverHide(); break;
  }
});
window.addEventListener('resize', ()=>{ if (mode==='auto'&&pinLL) pinTo(pinLL); });
setPinW(pinW); setCardScale(1); setBasemap('liberty'); applyTotal();
console.log(`photos: ${photos.length}, chapters: ${chapters.length}, pages: ${chapters.reduce((a,c)=>a+c.pages.length,0)}`);
window.__app={ map, chapters, photos, goTo, play, pause, setMode, trailClearAll, trails, bgm, get plan(){return plan;}, get pinLL(){return pinLL;}, FINALE, get gl(){ return (baseLayer && baseLayer.getMaplibreMap) ? baseLayer.getMaplibreMap() : null; },
  setBasemap, dropBasemap(){ if (baseLayer){ map.removeLayer(baseLayer); baseLayer=null; } baseKey=null; }, trailCanvas, mcg, markers };   // 錄影快轉用：先拿掉底圖、快轉完再掛回
})();
</script>
